name: Tests - payment-widget-web-sdk

on:
  push:
    paths:
      - 'packages/payment-widget-web-sdk/**'
    branches-ignore:
      - sandbox
      - 'environment/*'

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      NPM_WORKSPACE: packages/payment-widget-web-sdk
      NPM_VERSION: '12.0.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Pin npm
        working-directory: ${{ runner.temp }}
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Get NPM cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Restore NPM cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-arc-npm-${{ env.NPM_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-arc-npm-${{ env.NPM_VERSION }}-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --workspace $NPM_WORKSPACE

      - name: Run typecheck
        run: npm run typecheck --workspace $NPM_WORKSPACE

      - name: Run tests
        run: npm run test --workspace $NPM_WORKSPACE
